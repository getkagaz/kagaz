name: test

# The Go core must build and pass on Linux, where none of the macOS tools
# (pdftotext, kagaz-machelper, mdfind, brctl) exist. That is the honest test of
# graceful degradation (project constraint 9), so Linux is not optional here.

# Path filters are an allowlist starting from `**`, deliberately: anything new
# runs the suite until someone excludes it on purpose. A `paths-ignore` list
# would fail the other way, silently skipping tests for a file type nobody
# thought about.
#
# The one non-obvious entry is docs/AGENTS.template.md. It looks like prose and
# is excluded by `!**.md`, but internal/vaultkit/index/index_test.go reads it
# and asserts the embedded copy in internal/vaultkit/index/template/ has not
# drifted from it. It is data, so it is added back.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/AGENTS.template.md"
  pull_request:
    # Duplicated rather than anchored: GitHub Actions does not support YAML
    # anchors in workflow files. machelper.yml repeats its list for the same
    # reason. Keep the two lists in step.
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/AGENTS.template.md"
  workflow_dispatch:

# Read-only. This workflow runs on pull_request (fork PRs included) and must
# never be able to reach a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the Apple silicon (arm64) runner image and matches the
        # project's macOS floor. Apple silicon only: there is deliberately no
        # x86_64 job.
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # pdftotext (poppler) is a real runtime dependency, declared by
      # Formula/kagaz.rb, and the ingest tests exercise a genuine .pdf. Without
      # it every PDF path degrades to "no text could be extracted" and the
      # suite fails on both runners -- which is exactly what happened the first
      # time this workflow ever ran.
      - name: Install poppler
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          else
            brew install poppler
          fi
          pdftotext -v

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
