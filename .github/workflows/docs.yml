name: docs

# Builds the Jekyll site in docs/ and deploys it to GitHub Pages.
# Requires Settings → Pages → "Build and deployment" → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Build-only on PRs, so a docs change that breaks the Jekyll build is caught
  # in review rather than after merge on the deploy path.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time; never cancel a running one, or Pages can be left
  # serving a half-published build. PR builds get their own per-ref group so a
  # review build never queues behind (or blocks) a deploy.
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only meaningful when we are going to deploy; on a PR (forks included)
      # this job is a build check and touches no Pages configuration.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # docs/_config.yml sets its own `url`/`baseurl`; leave them alone rather
      # than letting the action override them.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
