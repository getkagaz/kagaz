name: release

# Builds arm64 bottles for `kagaz` and syncs both formulae to the tap repo
# (getkagaz/homebrew-kagaz).
#
# First run: v0.1.0, 2026-08-20. `meta` and `bottle` worked first time; `tap`
# failed at the push with a 403, because KAGAZ_TAP_TOKEN was scoped to "public
# repositories", which is read-only. Rescoping it to getkagaz/homebrew-kagaz
# with Contents: read and write fixed it, and the push was then verified end
# to end.
#
# KAGAZ_TAP_TOKEN expires 2026-11-14. When it does, `tap` will fail exactly
# this way again -- after `bottle` has already succeeded, so the release will
# look mostly fine while never reaching users. Renew it before then.
#
# Two triggers, one tag. `github.ref_name` is the tag on a tag push but the
# *default branch* on `release: published`, so the tag is resolved explicitly
# in the `meta` job and every later job reads that output instead.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build bottles for"
        required: true
        type: string

# No `pull_request` trigger anywhere in this file: a fork PR can never reach
# these secrets. Default token is read-only; the one job that needs to write
# release assets asks for `contents: write` itself.
permissions:
  contents: read

concurrency:
  # Keyed on the version so a tag push, a hand-published release and a manual
  # dispatch for the same version queue instead of racing. `github.ref_name` is
  # listed last and after `inputs.tag`: on a workflow_dispatch it is the branch
  # (`main`), which is truthy and would otherwise swallow the real tag and give
  # every dispatch the same useless `release-main` group.
  # Never cancel: a half-finished bottle upload is worse than a duplicate run.
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve tag
    if: github.repository == 'getkagaz/kagaz'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag for this trigger
        id: resolve
        env:
          # Passed through the environment, never interpolated into the shell:
          # a tag name is attacker-influenced text on a public repo.
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push)              tag="${REF#refs/tags/}" ;;
            *) echo "::error::unexpected event $EVENT_NAME"; exit 1 ;;
          esac

          # A real regex, not a glob: `case v[0-9]*` would happily accept
          # `v1;whatever`, which is not what a reader assumes it rejects.
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::resolved tag '$tag' is not a vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi

          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "${tag#v}" >>"$GITHUB_OUTPUT"
          printf 'Resolved tag: %s\n' "$tag"

  bottle:
    name: arm64 bottle
    needs: meta
    # Apple silicon only (project constraint 10). There is deliberately no
    # x86_64 job; Intel Macs are permanently out of scope.
    runs-on: macos-15
    permissions:
      contents: write # uploads bottle assets to the release
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      # HOMEBREW_NO_INSTALL_FROM_API=1 (set above, and required for bottling)
      # means Homebrew needs the homebrew/core tap on disk before it can
      # resolve poppler. Do that explicitly so a slow or failing clone is a
      # legible step failure rather than a mysterious hang inside `brew install`.
      - name: Tap homebrew/core
        run: brew tap --force homebrew/core

      - name: Point the formulae at this release's tarball
        run: |
          set -euo pipefail
          url="https://github.com/getkagaz/kagaz/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o source.tar.gz "$url"
          sha="$(shasum -a 256 source.tar.gz | cut -d' ' -f1)"
          echo "source tarball sha256: $sha"

          for f in Formula/kagaz.rb Formula/kagaz-mlx.rb; do
            /usr/bin/sed -i '' \
              -e "s|^  url \".*\"$|  url \"${url}\"|" \
              -e "s|^  version \".*\"$|  version \"${VERSION}\"|" \
              -e "s|^  sha256 \"[0-9a-f]\{64\}\"$|  sha256 \"${sha}\"|" \
              "$f"
            grep -E '^  (url|version|sha256) ' "$f"
          done

      - name: Stage a local tap
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/getkagaz/homebrew-kagaz"
          mkdir -p "$tap/Formula"
          cp Formula/kagaz.rb Formula/kagaz-mlx.rb "$tap/Formula/"
          git -C "$tap" init -q
          git -C "$tap" add -A
          git -C "$tap" -c user.name=ci -c user.email=ci@local commit -qm "$TAG"
          # Recent Homebrew refuses to load formulae from an untrusted tap.
          # Older versions have no `brew trust`, hence the tolerant `|| true`.
          brew trust getkagaz/kagaz || true
          echo "TAP=$tap" >>"$GITHUB_ENV"

      - name: Build the bottle
        id: bottle
        run: |
          set -euo pipefail
          brew install --build-bottle --verbose getkagaz/kagaz/kagaz
          brew test getkagaz/kagaz/kagaz
          brew bottle \
            --json \
            --no-rebuild \
            --root-url="https://github.com/getkagaz/kagaz/releases/download/${TAG}" \
            getkagaz/kagaz/kagaz
          ls -l ./*.bottle.tar.gz ./*.bottle.json
          # Write the bottle block (with its sha256) into the staged formula.
          brew bottle --merge --write --no-commit ./*.bottle.json
          cp "$TAP/Formula/kagaz.rb" ./kagaz.rb
          printf 'bottled=true\n' >>"$GITHUB_OUTPUT"

      - name: Ensure the release object exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # On a v* tag push this job and tag-release.yml start at the same
          # instant with no ordering between them. The bottle build usually
          # takes far longer, so the release usually exists by now — but if
          # release creation was delayed or failed, the upload below would die
          # after a full bottle build and the bottles would be lost.
          #
          # Wait briefly for tag-release.yml, then create the release ourselves
          # rather than failing. Every branch here logs which one it took, so a
          # missing tag-release run is visible instead of silently papered over.
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists (attempt $attempt)."
              exit 0
            fi
            echo "Release $TAG not present yet; waiting 10s (attempt $attempt/6)."
            sleep 10
          done

          echo "::warning::Release $TAG did not appear after 60s; tag-release.yml may have failed or been skipped. Creating it here so the bottles are not lost."
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $prerelease

      - name: Upload the bottle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Homebrew names the local file with `--` and the download with `-`.
          for f in ./*.bottle.tar.gz; do
            dest="$(basename "$f" | sed 's|--|-|')"
            [ "$f" = "./$dest" ] || cp "$f" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          done
          gh release upload "$TAG" ./*.bottle.json --clobber

      - name: Keep the bottled formulae for the tap job
        uses: actions/upload-artifact@v7
        with:
          name: formulae
          path: |
            kagaz.rb
            Formula/kagaz-mlx.rb
          if-no-files-found: error

  tap:
    name: sync tap
    needs: [meta, bottle]
    runs-on: ubuntu-latest
    # KAGAZ_TAP_TOKEN is a PAT with write access to getkagaz/homebrew-kagaz.
    # Without it this job is skipped and the release simply has no tap update
    # — the bottles are still attached to the GitHub Release.
    steps:
      - name: Download the bottled formulae
        uses: actions/download-artifact@v8
        with:
          name: formulae
          path: staged

      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.KAGAZ_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::KAGAZ_TAP_TOKEN is not configured; skipping tap sync."
            printf 'present=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'present=true\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Push the formulae to getkagaz/homebrew-kagaz
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.KAGAZ_TAP_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/getkagaz/homebrew-kagaz.git" tap
          mkdir -p tap/Formula
          cp staged/kagaz.rb tap/Formula/kagaz.rb
          cp staged/Formula/kagaz-mlx.rb tap/Formula/kagaz-mlx.rb

          cd tap
          git config user.name "kagaz-release[bot]"
          git config user.email "kagaz-release@users.noreply.github.com"

          # Stage FIRST, then ask git what is actually staged. `git diff --quiet`
          # on the worktree cannot see untracked files, so on the very first
          # release — when the tap is empty and both formulae are new — it
          # exits 0 and this job would report success having pushed nothing,
          # leaving `brew install getkagaz/kagaz/kagaz` broken for every user
          # while all workflows showed green. The same trap re-fires whenever a
          # formula file is newly added to an existing tap.
          #
          # `git status --porcelain` rather than `git diff --cached --quiet`:
          # both work, but the first run clones a tap that may have no commits
          # at all, and `status` needs no HEAD to compare against.
          git add Formula/kagaz.rb Formula/kagaz-mlx.rb
          staged="$(git status --porcelain -- Formula/kagaz.rb Formula/kagaz-mlx.rb)"
          if [ -z "$staged" ]; then
            echo "Tap already contains these exact formulae for ${TAG}; nothing to push."
            exit 0
          fi

          echo "Staged for the tap:"
          echo "$staged"
          git commit -m "kagaz ${TAG}"
          # `git push` alone fails on a freshly cloned empty repo (no upstream).
          git push origin HEAD

          echo "Pushed to getkagaz/homebrew-kagaz for ${TAG}:"
          git show --stat --oneline HEAD | sed 's/^/  /'

      - name: Summary
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          SYNCED: ${{ steps.token.outputs.present }}
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "- arm64 bottle for \`kagaz\`: built and uploaded to the release."
            echo "- \`kagaz-mlx\`: formula synced without a bottle. It is opt-in and"
            echo "  builds from source; bottling the whole MLX-Swift graph is not"
            echo "  attempted here."
            echo "- Tap sync: ${SYNCED}"
          } >>"$GITHUB_STEP_SUMMARY"
