# Example vault.yaml, fully commented.
#
# This is a starting point, not a template you must keep intact: every field
# here has a built-in default (see docs/configuration.md), so a real vault.yaml
# can be much shorter. `kagaz init` writes a minimal one; this file exists to
# show every knob in one place, with reasoning, for a global (locale-agnostic)
# vault.
#
# The machine-readable version of this same schema lives at
# docs/vault.schema.json. If this file and internal/vaultkit/config/config.go
# ever disagree, the Go source is authoritative.

version: 1

# A human label for this vault, so several vaults are told apart by what they
# are for rather than by where they sit. Shown by `kagaz doctor` and used as the
# title of the generated INDEX.md and AGENTS.md. Display only: it is never a
# folder name and never part of any path. Omit it and Kagaz shows the vault_root
# folder name instead, which is what every vault.yaml written so far does.
# name: Personal & Family KYC

# Root directory of the vault. A leading ~ expands to your home directory. A
# relative path resolves against the directory holding this vault.yaml, so
# the vault stays portable if you move it (including in/out of iCloud Drive).
vault_root: ~/Documents

fiscal_year:
  # 1 = calendar year (global default). Use 4 for India/Japan/UK-style years,
  # 7 for Australia, 10 for the US federal fiscal year.
  start_month: 1
  # Placeholders: {yyyy1} {yyyy2} full years, {yy1} {yy2} two-digit years.
  # "FY {yyyy1}" renders "FY 2026"; "FY {yy1}-{yy2}" renders "FY 25-26" for a
  # split fiscal year (start_month != 1).
  label_format: "FY {yyyy1}"

# Vault owners. `tag` defaults to a lowercase slug of `name` when omitted
# (e.g. "Alex Rao" -> "alex-rao") and must be unique across people.
people:
  - name: Alex Rao
    tag: alex-rao
  - name: Sam Rao
    tag: sam-rao

owner_groups:
  # How a document belonging to more than one person is addressed.
  separator_folder: "+"      # folder name for shared docs: "Alex+Sam"
  separator_filename: "+"    # filename field for shared docs: "Alex+Sam"
  order: alphabetical        # only "alphabetical" changes ordering today

filename:
  # {DocType} is mandatory. Required fields must precede optional ([...])
  # ones. Recognised fields: {DocType} {Names} {Identifier} {Year} {Modifier}.
  pattern: "{DocType}_{Names}_{Identifier}[_{Year}][_{Modifier}]"
  # word_separator joins words *within* a field: "Boarding-Pass".
  word_separator: "-"
  # field_separator joins fields: "Invoice_Alex-Rao_Acme-Corp_2026".
  # Must differ from word_separator.
  field_separator: "_"

# Maps doctype categories onto folders beneath vault_root. This is the
# global-first default set (config.DefaultStructure) written out explicitly
# so every option is visible. Omit `structure:` entirely to get this same
# default without typing it.
#
# `layout` is a slash-separated template of {Owner} and {FY} segments
# describing the subtree under `path`. Categories that accumulate one
# document per fiscal period (financial, company, utility) default to
# "{Owner}/{FY}"; everything else defaults to "{Owner}".
#
# `shared` names the folder used instead of {Owner} for a document owned by
# several people or by nobody — a third party's certificate, say. Clear it on
# a category to make Kagaz refuse to file an unowned document there rather
# than invent an owner for it.
structure:
  personal:
    path: Personal
    shared: _Shared
    layout: "{Owner}"
  company:
    path: Company
    shared: _Shared
    layout: "{Owner}/{FY}"
  financial:
    path: Financial
    shared: _Shared
    layout: "{Owner}/{FY}"
  travel:
    path: Travel
    shared: _Shared
    layout: "{Owner}"
  identity:
    path: Identity
    shared: _Shared
    layout: "{Owner}"
  insurance:
    path: Insurance
    shared: _Shared
    layout: "{Owner}"
  medical:
    path: Medical
    shared: _Shared
    layout: "{Owner}"
  legal:
    path: Legal
    shared: _Shared
    layout: "{Owner}"
  property:
    path: Property
    shared: _Shared
    layout: "{Owner}"
  vehicles:
    path: Vehicles
    shared: _Shared
    layout: "{Owner}"
  utility:
    path: Utilities
    shared: _Shared
    layout: "{Owner}/{FY}"

tags:
  # Open, vault-specific vocabularies. Anything not listed here (or a
  # configured person's tag, or a lifecycle tag below) is a `kagaz lint`
  # finding: an uncontrolled tag vocabulary is what makes saved mdfind
  # searches unreliable.
  companies:
    - acme-corp
    - globex
  areas:
    - tax
    - visa
    - warranty
  fiscal_years:
    - fy2025
    - fy2026
  # Defaults to config.DefaultLifecycleTags() when omitted; written out here
  # for visibility.
  lifecycle:
    - active
    - superseded
    - encrypted
    - confidential
    - to-action
    - dont-touch

ocr:
  # Language hints for Apple Vision OCR (kagaz-machelper).
  vision_languages:
    - en-US
  ollama:
    # auto | true | false. "auto" only tries Ollama after pdftotext and
    # Vision have both failed to produce usable text (e.g. a hard scan).
    enabled: auto
    # Required only if you want Ollama in the OCR rotation at all. Some
    # vision models need their exact trained prompt phrase; see
    # docs/model-use.md.
    model: ""
    # Must resolve to localhost; Kagaz refuses any other host, re-checked
    # at call time, not just here.
    endpoint: "http://localhost:11434"

classify:
  # apple | mlx | ollama | rules.
  #
  #   apple   apple  -> rules   (the default)
  #   mlx     mlx    -> rules
  #   ollama  ollama -> rules
  #   rules   rules only; no model is run and no probe is taken
  #
  # Every model engine ends at the deterministic rules tier: falling back is
  # part of what an engine IS, not a separate setting, and "rules" is the
  # no-model choice. There is no "auto" -- a chain you cannot see is one you
  # cannot reason about -- and a vault.yaml that still says `engine: auto` is
  # rejected with an error rather than silently read as something else.
  #
  # apple needs nothing downloaded and nothing running: where Apple's
  # on-device model is missing (before macOS 26) the rules tier answers. mlx
  # and ollama are installed on purpose, so naming one that is not there is an
  # error naming the fix. `kagaz doctor` prints the order it will actually try.
  engine: apple
  # Used by the mlx and ollama engines. The default is a pinned MLX text
  # LLM (not a vision-language model) fetched by `kagaz model pull`.
  model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
  endpoint: "http://localhost:11434"
  min_confidence: 0.5

encrypted_docs:
  # Leave password-protected documents encrypted in place rather than
  # prompting to decrypt them.
  keep_encrypted: false
  # Only "keychain" is implemented: passwords never appear in a filename,
  # sidecar, INDEX.md, manifest or log -- only the Keychain item name does.
  password_store: keychain

lint:
  require_lifecycle_tag: false
  # Doctypes for which at most one document per owner may be tagged
  # "active" at a time -- catches "I forgot to supersede my old passport".
  single_active_per_doctype_per_person:
    - passport
    - drivers-license
    - insurance-policy
  forbid_passwords_in_filenames: true

confidential:
  # Gates `kagaz resolve --for-send`: resolving a confidential document for
  # handoff outside the vault always requires explicit confirmation and
  # always writes an audit line, confirmed or refused.
  require_confirmation_on_resolve_for_send: true
  audit_log: vault.log

# Per-vault additions to, or overrides of, the built-in doctype catalog. An
# entry whose `name` matches a built-in replaces that built-in entirely.
# `category` must already exist in `structure` above. `extract` regexes need
# exactly one capture group. See CONTRIBUTING.md for when to add a doctype
# here versus upstreaming it to internal/vaultkit/doctypes.
doctypes:
  - name: warranty-card
    category: personal
    match:
      keywords:
        - warranty card
        - proof of purchase
        - warranty period
      patterns: []
    extract:
      purchase_date: '(?i)purchase\s+date[:\s]{1,4}([0-9]{1,2}[ /.\-][A-Za-z0-9]{2,9}[ /.\-][0-9]{2,4})'
